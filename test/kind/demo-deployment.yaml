apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-b
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: svc-b }
  template:
    metadata:
      labels: { app: svc-b }
    spec:
      containers:
        - name: svc-b
          image: demo-service-b:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: svc-b
  namespace: demo
spec:
  selector: { app: svc-b }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: svc-a }
  template:
    metadata:
      labels: { app: svc-a }
    spec:
      containers:
        - name: svc-a
          image: demo-service-a:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: SERVICE_B_URL
              value: "http://svc-b.demo.svc.cluster.local:8081"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: svc-a
  namespace: demo
spec:
  selector: { app: svc-a }
  ports: [{ port: 8080, targetPort: 8080 }]
