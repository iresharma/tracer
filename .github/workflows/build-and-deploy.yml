name: Build and deploy

# Builds both images, pushes them to Docker Hub, then bumps the image tag
# in the homelab GitOps repo (which ArgoCD auto-syncs on push to main) —
# so a merge to main here rolls out to the cluster with no manual step.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/docker/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

env:
  DOCKERHUB_NAMESPACE: iresharma
  GITOPS_REPO: utkarsh-homelab/homelab-gitops-tenant
  GITOPS_MANIFEST: apps/tracer-app.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/tracer-collector:${{ steps.vars.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/tracer-collector:latest
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/tracer-agent:${{ steps.vars.outputs.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/tracer-agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homelab-gitops-tenant
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.HOMELAB_GITOPS_TOKEN }}
          path: gitops

      - name: Bump tracer image tags
        working-directory: gitops
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|image: ${DOCKERHUB_NAMESPACE}/tracer-collector:.*|image: ${DOCKERHUB_NAMESPACE}/tracer-collector:${TAG}|" \
            -e "s|image: ${DOCKERHUB_NAMESPACE}/tracer-agent:.*|image: ${DOCKERHUB_NAMESPACE}/tracer-agent:${TAG}|" \
            "$GITOPS_MANIFEST"
          git diff -- "$GITOPS_MANIFEST"

      - name: Commit and push
        working-directory: gitops
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "tracer-ci"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- "$GITOPS_MANIFEST"; then
            echo "No image tag change, nothing to commit."
            exit 0
          fi
          git add "$GITOPS_MANIFEST"
          git commit -m "deploy tracer ${TAG}" -m "Automated image bump from iresharma/tracer@${{ github.sha }}"
          git push
