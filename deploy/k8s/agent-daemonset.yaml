# No ServiceAccount / RBAC objects here — intentional. The agent derives all
# namespace/pod/container metadata from the kubelet's on-disk log path
# naming (/var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log) and never
# talks to the Kubernetes API server, so it needs no permissions there.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tracer-agent
  namespace: tracer-system
  labels:
    app: tracer-agent
spec:
  selector:
    matchLabels:
      app: tracer-agent
  template:
    metadata:
      labels:
        app: tracer-agent
    spec:
      # No ServiceAccount is set (defaults to the namespace's "default" SA)
      # since none of the agent's calls ever reach the API server.
      terminationGracePeriodSeconds: 15
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: tracer-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: tracer-agent-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            # Mounting the whole /var/log tree (not just /var/log/pods) is
            # deliberate: pod log entries under /var/log/pods are typically
            # symlinks resolving through /var/log/containers into
            # runtime-specific storage, and mounting the parent guarantees
            # those symlink chains resolve regardless of container runtime.
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # hostPath (not emptyDir) so checkpoints survive agent pod
            # restarts on the same node.
            - name: checkpoints
              mountPath: /var/lib/tracer-agent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/tracer-agent
            type: DirectoryOrCreate
