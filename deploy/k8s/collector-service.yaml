# ClusterIP only, intentionally. The collector enforces HTTP Basic Auth in
# front of the UI/JSON API and a bearer token in front of ingest (see
# tracer-collector-auth Secret / AUTH_USERNAME, AUTH_PASSWORD,
# INGEST_AUTH_TOKEN), but that auth is only as strong as the credentials you
# set — leaving them unset disables the corresponding layer entirely. Reach
# this Service via `kubectl port-forward`, or put your own authenticating
# Ingress/reverse-proxy in front of it; don't expose it externally without
# doing one of those and setting real credentials first.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: tracer-system
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
