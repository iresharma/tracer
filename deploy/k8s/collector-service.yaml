# ClusterIP only, intentionally. The collector now checks HTTP Basic auth
# on the UI/JSON API and a bearer token on the ingest path (see
# collector-secret.yaml, and internal/collector/auth), but both are a
# single shared credential each, not a real multi-user auth system — good
# enough for a homelab, not for exposing this beyond a trusted network.
# Reach it via `kubectl port-forward`, or put your own authenticating
# Ingress/reverse-proxy (plus TLS — Basic auth over plaintext leaks the
# password) in front of it if you need it reachable more broadly.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: tracer-system
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
