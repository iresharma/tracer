# ClusterIP only, intentionally. The collector requires HTTP Basic Auth in
# front of the UI/JSON query API and a bearer token in front of the ingest
# endpoint (see deploy/k8s/collector-secret.yaml), but there's still no TLS
# termination here — put a TLS-terminating Ingress/reverse-proxy in front
# of it before exposing it outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: tracer-system
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
