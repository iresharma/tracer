# ClusterIP only, intentionally. The collector now supports opt-in HTTP
# Basic Auth in front of the UI/JSON API (UI_AUTH_USERNAME/UI_AUTH_PASSWORD)
# and an opt-in bearer token in front of ingest (INGEST_AUTH_TOKEN) — see
# collector-secret.yaml. Set those before relying on them; they're plaintext
# over HTTP, not a substitute for TLS. Reach this Service via
# `kubectl port-forward`, or put a real TLS-terminating Ingress/reverse-proxy
# in front of it if you want to expose it beyond the cluster.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: tracer-system
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
