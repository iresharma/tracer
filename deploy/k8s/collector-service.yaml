# ClusterIP only, intentionally. The collector enforces HTTP Basic auth in
# front of the UI/JSON query API and a bearer token in front of ingest when
# AUTH_USERNAME/AUTH_PASSWORD and INGEST_TOKEN are configured (see
# collector-auth-secret.yaml) — both are off by default for local/dev use.
# Neither of those is TLS: reach this Service via `kubectl port-forward`,
# or put your own TLS-terminating Ingress/reverse-proxy in front of it —
# do not expose this Service externally as-is.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: tracer-system
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
