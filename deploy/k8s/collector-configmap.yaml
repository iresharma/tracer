apiVersion: v1
kind: ConfigMap
metadata:
  name: tracer-collector-config
  namespace: tracer-system
data:
  HTTP_ADDR: ":8080"
  DB_PATH: "/data/tracer.db"
  RETENTION_DAYS: "10"
  TRACE_SEARCH_WINDOW_DAYS: "2"
  SQLITE_CACHE_KB: "16000"
  INGEST_CHAN_CAPACITY: "5000"
  WRITER_FLUSH_MS: "200"
  WRITER_FLUSH_SIZE: "500"
  # INGEST_AUTH_TOKEN and UI_AUTH_USERNAME/UI_AUTH_PASSWORD are secrets, not
  # ordinary config — they live in the tracer-collector-auth Secret
  # (collector-secret.yaml) and are injected via secretKeyRef in
  # collector-deployment.yaml, not here.
