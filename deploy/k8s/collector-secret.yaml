# Placeholder credentials — DO NOT use these values as-is in any real
# deployment. Replace them before applying, e.g.:
#
#   kubectl create secret generic tracer-collector-auth \
#     --namespace tracer-system \
#     --from-literal=AUTH_USERNAME=admin \
#     --from-literal=AUTH_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=INGEST_TOKEN="$(openssl rand -hex 32)"
#
# or manage it out-of-band with sealed-secrets / SOPS / your cluster's
# secret manager of choice instead of committing this file as-is.
#
# AUTH_USERNAME/AUTH_PASSWORD gate the UI and JSON query API with HTTP
# Basic Auth. INGEST_TOKEN gates POST /api/v1/logs (used by the
# tracer-agent DaemonSet, see agent-daemonset.yaml) with a bearer token.
apiVersion: v1
kind: Secret
metadata:
  name: tracer-collector-auth
  namespace: tracer-system
type: Opaque
stringData:
  AUTH_USERNAME: "CHANGE_ME_username"
  AUTH_PASSWORD: "CHANGE_ME_password"
  INGEST_TOKEN: "CHANGE_ME_ingest_token"
