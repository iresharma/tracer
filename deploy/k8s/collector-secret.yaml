# Placeholder credentials only — do NOT commit real secrets to git.
# Replace the stringData values below before applying, or skip this file
# entirely and generate the Secret imperatively instead, e.g.:
#   kubectl create secret generic tracer-collector-auth \
#     --namespace tracer-system \
#     --from-literal=ui-username=<user> \
#     --from-literal=ui-password=<pass> \
#     --from-literal=ingest-token=<token>
#
# ui-username/ui-password gate the UI and JSON query API behind HTTP Basic
# Auth (collector-deployment.yaml wires these to UI_AUTH_USERNAME /
# UI_AUTH_PASSWORD). ingest-token gates POST /api/v1/logs behind a bearer
# token (wired to INGEST_AUTH_TOKEN) and must match the value the agent is
# configured with (see agent-daemonset.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: tracer-collector-auth
  namespace: tracer-system
type: Opaque
stringData:
  ui-username: "changeme"
  ui-password: "changeme"
  ingest-token: "changeme"
