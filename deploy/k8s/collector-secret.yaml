# Template only — do not commit this file with real values filled in.
# Copy/regenerate locally (e.g. `kubectl create secret generic ... --dry-run`)
# and apply the result; keep real credentials out of version control.
#
# AUTH_USERNAME / AUTH_PASSWORD gate the collector's UI and query API
# behind HTTP Basic Auth. INGEST_AUTH_TOKEN gates the ingest endpoint
# behind a bearer token. Leaving any of these empty disables that check
# (backward-compat default) — operators SHOULD set all three.
apiVersion: v1
kind: Secret
metadata:
  name: tracer-collector-auth
  namespace: tracer-system
type: Opaque
stringData:
  AUTH_USERNAME: "CHANGE_ME_USERNAME"
  AUTH_PASSWORD: "CHANGE_ME_PASSWORD"
  INGEST_AUTH_TOKEN: "CHANGE_ME_INGEST_TOKEN"
