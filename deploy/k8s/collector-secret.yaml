# Placeholder Secret — change every value below before deploying.
#
# INGEST_AUTH_TOKEN is a shared secret between the collector and every
# agent: it must match the INGEST_AUTH_TOKEN in agent-secret.yaml exactly,
# since the agent sends it as "Authorization: Bearer <token>" on
# POST /api/v1/logs and the collector checks it with a constant-time
# comparison.
#
# UI_AUTH_USERNAME/UI_AUTH_PASSWORD gate the server-rendered UI and the
# JSON query API via HTTP Basic auth — this is a single shared
# operator credential, not a multi-user login system.
#
# Generate real values with e.g. `openssl rand -hex 32`, and prefer
# creating this Secret out-of-band (kubectl create secret / a secrets
# manager / sealed-secrets) rather than committing real values here.
#
# Leaving these unset (or applying this file as-is with the placeholders
# left in place — don't) makes the collector log a startup warning and
# run that surface unauthenticated, which is fine for a fully isolated
# local playground but not for anything reachable beyond it.
apiVersion: v1
kind: Secret
metadata:
  name: tracer-collector-auth
  namespace: tracer-system
type: Opaque
stringData:
  INGEST_AUTH_TOKEN: "REPLACE_ME_INGEST_TOKEN"
  UI_AUTH_USERNAME: "REPLACE_ME_UI_USERNAME"
  UI_AUTH_PASSWORD: "REPLACE_ME_UI_PASSWORD"
