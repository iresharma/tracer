# Placeholder only — replace CHANGE_ME below before applying, or better,
# skip this file entirely and create the Secret out-of-band instead of
# committing real credentials, e.g.:
#
#   kubectl create secret generic tracer-collector-auth -n tracer-system \
#     --from-literal=AUTH_USERNAME=... \
#     --from-literal=AUTH_PASSWORD=... \
#     --from-literal=INGEST_TOKEN=...
#
# Leaving AUTH_USERNAME/AUTH_PASSWORD empty disables basic auth on the UI
# and query API; leaving INGEST_TOKEN empty disables the bearer check on
# ingest. Both are off by default for local/dev convenience — set real
# values here before exposing the collector beyond a trusted cluster.
apiVersion: v1
kind: Secret
metadata:
  name: tracer-collector-auth
  namespace: tracer-system
type: Opaque
stringData:
  AUTH_USERNAME: "CHANGE_ME"
  AUTH_PASSWORD: "CHANGE_ME"
  INGEST_TOKEN: "CHANGE_ME"
