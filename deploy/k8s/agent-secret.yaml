# Placeholder Secret — change the value below before deploying.
#
# INGEST_AUTH_TOKEN must exactly match the collector's INGEST_AUTH_TOKEN
# (see collector-secret.yaml): it's a single shared secret both sides
# authenticate with, sent as "Authorization: Bearer <token>" on every
# POST /api/v1/logs.
#
# Generate a real value with e.g. `openssl rand -hex 32`, and prefer
# creating this Secret out-of-band rather than committing real values
# here.
apiVersion: v1
kind: Secret
metadata:
  name: tracer-agent-auth
  namespace: tracer-system
type: Opaque
stringData:
  INGEST_AUTH_TOKEN: "REPLACE_ME_INGEST_TOKEN"
